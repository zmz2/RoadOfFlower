name: Sync Actual Agent Skill Index

on:
  push:
    branches:
      - agent/skill-map-1200
    paths:
      - '.bootstrap/sync_actual_skills.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-actual-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify parser contract
        run: python .bootstrap/test_sync_actual_skills.py -v

      - name: Synchronize real Skill links
        run: python .bootstrap/sync_actual_skills.py "$GITHUB_WORKSPACE"

      - name: Validate catalog, tests, and search
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_catalog.py
          python -m unittest discover -v
          python scripts/search_skills.py 'pdf document' --limit 5
          python scripts/search_skills.py 'github pull request' --limit 5

      - name: Guard workflow files
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .github/workflows; then
            echo 'Synchronization must never modify workflow files.' >&2
            git diff -- .github/workflows >&2
            exit 1
          fi

      - name: Publish generated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to publish workflow-file changes.' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'Catalog is already current.'
            exit 0
          fi
          git commit -m 'Index real Agent Skills and publish project README'
          git push origin HEAD:agent/skill-map-1200
